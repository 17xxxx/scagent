# ═══════════════════════════════════════════════════════════════════════════════
#  deploy/docker-compose.secrets-token.yml —— 【只有访问令牌、没有 LLM 密钥】时的叠加文件
#
#  为什么需要它：
#    docker-compose.secrets.yml 同时挂 deepseek_api_key 与 scagent_token，
#    而 compose 的 file 型 secret **只要有一个文件不存在，整个 up 就报错**。
#    于是"暂时没有 LLM 密钥"这种【受支持】的用法会被挡在门外 ——
#    例如 SCAGENT_LLM_PROVIDER=none（只跑确定性流水线），或者先跑起来、稍后再补密钥。
#
#  由 deploy/up.sh 与 deploy/doctor.sh 自动判定，通常无需手工指定：
#      docker compose -f deploy/docker-compose.yml \
#                     -f deploy/docker-compose.secrets-token.yml up -d
#
#  令牌仍然走【文件方式】——不进环境变量、不进 docker inspect，与完整 secrets 方式一致。
#  缺少 LLM 密钥时服务照常启动，只是"规划分析步骤"会提示缺少 API Key。
# ═══════════════════════════════════════════════════════════════════════════════

services:
  agent:
    secrets:
      - scagent_token
    environment:
      SCAGENT_TOKEN_FILE: /run/secrets/scagent_token

secrets:
  scagent_token:
    file: ${SCAGENT_SECRETS_DIR:-./secrets}/scagent_token
