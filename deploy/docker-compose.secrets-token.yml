# ═══════════════════════════════════════════════════════════════════════════════
#  deploy/docker-compose.secrets-token.yml —— 【只有访问令牌、没有 LLM 密钥】时的叠加文件
#
#  适用场景：只有 scagent_token、没有 deepseek_api_key 时（例如使用本地模型
#  SCAGENT_LLM_PROVIDER=ollama，不需要 API Key）。
#  docker-compose.secrets.yml 同时挂两个 secret，而 compose 的 file 型 secret
#  在任一源文件缺失时会创建占位目录，因此需要一个只挂令牌的叠加文件。
#
#  由 deploy/up.sh 与 deploy/doctor.sh 自动判定，通常无需手工指定：
#      docker compose -f deploy/docker-compose.yml \
#                     -f deploy/docker-compose.secrets-token.yml up -d
#
#  令牌仍走【文件方式】——不进环境变量、不进 docker inspect，与完整 secrets 方式一致。
# ═══════════════════════════════════════════════════════════════════════════════

services:
  agent:
    secrets:
      - scagent_token
    environment:
      SCAGENT_TOKEN_FILE: /run/secrets/scagent_token

secrets:
  scagent_token:
    file: ${SCAGENT_SECRETS_DIR:-./secrets}/scagent_token
