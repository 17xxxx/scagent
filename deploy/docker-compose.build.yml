# ═══════════════════════════════════════════════════════════════════════════════
#  deploy/docker-compose.build.yml —— 构建机专用
#
#  只在「构建机」上使用：它需要外网（拉基础镜像 + 访问 PPM 装 R 包）。
#  服务器绝不使用本文件。
#
#  两个镜像分层构建：
#    scagent-runtime  —— 重型，108 个 R 包，半年重建一次
#    scagent-seurat   —— 轻量，只 COPY 代码，改一次代码重建一次（数秒）
#
#  镜像名**只用** ${SCAGENT_IMAGE_PREFIX} + ${SCAGENT_VERSION} 拼接 ——
#  与 deploy/docker-compose.yml 完全一致，保证"构建出来的 tag == 运行时找的 tag"。
#  因此本文件要求 deploy/.env 里已设置这两个变量（通常由 install/configure 生成）。
#
#  用法：
#    ⚠️ **必须分两步**：compose 会并行构建，而 seurat 层的 `FROM ${RUNTIME}` 在
#       runtime 镜像尚不存在时，会按非限定名去 Docker Hub 找
#       docker.io/<prefix>/scagent-runtime:<ver> → 必然失败（实测被镜像源 403）。
#       depends_on 只约束 up 的顺序，不约束并行 build。
#        1) docker compose -f deploy/docker-compose.build.yml build runtime
#        2) docker compose -f deploy/docker-compose.build.yml build seurat agent
#    Windows 直接用： deploy\scagent.cmd build [-Force]
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── R 运行时（重型基座）────────────────────────────────────────────────────
  runtime:
    build:
      context: ..
      dockerfile: seurat_backend/Dockerfile.runtime
    image: ${SCAGENT_IMAGE_PREFIX:?SCAGENT_IMAGE_PREFIX 必须设置，见 deploy/.env.sample}/scagent-runtime:${SCAGENT_VERSION:?SCAGENT_VERSION 必须设置}

  # ── R 应用层（依赖 runtime）────────────────────────────────────────────────
  seurat:
    build:
      context: ..
      dockerfile: seurat_backend/Dockerfile
      args:
        RUNTIME: ${SCAGENT_IMAGE_PREFIX:?}/scagent-runtime:${SCAGENT_VERSION:?}
    image: ${SCAGENT_IMAGE_PREFIX:?}/scagent-seurat:${SCAGENT_VERSION:?}
    depends_on:
      - runtime

  # ── Agent 服务 ─────────────────────────────────────────────────────────────
  agent:
    build:
      context: ..
      dockerfile: agent_core/Dockerfile
    image: ${SCAGENT_IMAGE_PREFIX:?}/scagent-agent:${SCAGENT_VERSION:?}
