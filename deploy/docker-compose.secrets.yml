# ═══════════════════════════════════════════════════════════════════════════════
#  deploy/docker-compose.secrets.yml —— 生产启用 Docker secrets 的叠加文件
#
#  为什么用叠加文件而不是直接改 docker-compose.yml：
#    加了 secrets 段后，若 deploy/secrets/ 里的文件不存在，`docker compose up`
#    会直接报错。做成叠加文件后，不用 secrets 的部署完全不受影响。
#
#  用法（由 deploy/up.sh 自动判定，通常无需手工指定）：
#      docker compose -f deploy/docker-compose.yml \
#                     -f deploy/docker-compose.secrets.yml up -d
#
#  准备密钥（目录用 .env 里的 SCAGENT_SECRETS_DIR；建议放在仓库之外）：
#      SECRETS=/srv/scagent/secrets          # Windows: D:/scagent/secrets
#      mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
#      printf '%s' 'sk-你的密钥'  > "$SECRETS/deepseek_api_key"
#      printf '%s' "$(openssl rand -hex 24)" > "$SECRETS/scagent_token"
#      chmod 600 "$SECRETS"/*
#      # 属主必须等于容器内运行用户的 UID，否则容器读不到：
#      ./scripts/check_secrets.sh --prod
#
#  ⚠️ 两个易踩的坑（详见 docs 与 scripts/check_secrets.sh）：
#    1. Compose 的 file 型 secret 底层是 bind mount，
#       services.secrets 的 uid/gid/mode 属性【不被支持】——
#       属主完全由宿主机文件决定。
#    2. SELinux Enforcing 的机器上，标签不匹配会 EPERM 而 ls -l 看着正常，
#       需预先 chcon -t container_file_t。
#
#  启用后，deploy/.env 里就不应再保留 DEEPSEEK_API_KEY / SCAGENT_TOKEN
#  （两者都配时以 *_FILE 为准，但留着会让"密钥到底在哪"变得含糊）。
# ═══════════════════════════════════════════════════════════════════════════════

services:
  agent:
    # secret 以只读文件形式挂到 /run/secrets/，不进环境变量、不进 docker inspect
    secrets:
      - deepseek_api_key
      - scagent_token
    environment:
      SCAGENT_LLM_API_KEY_FILE: /run/secrets/deepseek_api_key
      SCAGENT_TOKEN_FILE:       /run/secrets/scagent_token

secrets:
  deepseek_api_key:
    file: ${SCAGENT_SECRETS_DIR:-./secrets}/deepseek_api_key
  scagent_token:
    file: ${SCAGENT_SECRETS_DIR:-./secrets}/scagent_token
