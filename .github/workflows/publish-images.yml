# ═══════════════════════════════════════════════════════════════════════════════
#  .github/workflows/publish-images.yml —— 构建并发布镜像到 GHCR
#
#  触发方式：
#    · 打 tag：  git tag v1.0.0 && git push origin v1.0.0
#    · 手动：    仓库 → Actions → publish-images → Run workflow（填版本号）
#
#  产物（对应 deploy/.env 的 SCAGENT_IMAGE_PREFIX）：
#    ghcr.io/<owner>/scagent/scagent-runtime:<版本>
#    ghcr.io/<owner>/scagent/scagent-seurat:<版本>
#    ghcr.io/<owner>/scagent/scagent-agent:<版本>
#    部署方把 SCAGENT_IMAGE_PREFIX 设为 ghcr.io/<owner>/scagent 即可拉取。
#
#  顺序与耗时：
#    runtime → seurat → agent 必须串行（seurat 的 `FROM ${RUNTIME}` 要求 runtime 已存在）。
#    runtime 层安装 100 余个 R 包，首次约 30–90 分钟；`type=gha` 缓存加速后续构建。
#
#  发布后：在 GitHub 的 Packages 页面把三个包设为 Public，匿名用户才能直接拉取。
# ═══════════════════════════════════════════════════════════════════════════════

name: publish-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（作为镜像 tag，例如 1.0.0）"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

# GITHUB_TOKEN 需要 packages:write 才能推 GHCR
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/scagent

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300          # runtime 层首次 30–90 分钟，留足余量
    concurrency:
      group: publish-images
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"      # v1.0.0 -> 1.0.0
          fi
          case "$v" in
            [0-9]*) ;;                                   # 版本号必须以数字开头
            *) echo "无效版本号：$v（应以数字开头，如 1.0.0）" >&2; exit 1 ;;
          esac
          case "$v" in
            *[!A-Za-z0-9._-]*) echo "无效版本号：$v（只允许字母、数字、点、下划线、连字符）" >&2; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "将发布 $IMAGE_NAMESPACE/scagent-{runtime,seurat,agent}:$v"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 1/3 R 运行时层（重型，很少变，缓存收益最大）──────────────────────
      - name: 构建并推送 scagent-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: seurat_backend/Dockerfile.runtime
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/scagent-runtime:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # ── 2/3 seurat 应用层（依赖上一步的 runtime）─────────────────────────
      - name: 构建并推送 scagent-seurat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: seurat_backend/Dockerfile
          push: true
          build-args: |
            RUNTIME=${{ env.IMAGE_NAMESPACE }}/scagent-runtime:${{ steps.ver.outputs.version }}
          tags: ${{ env.IMAGE_NAMESPACE }}/scagent-seurat:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=seurat

      # ── 3/3 agent 服务 ──────────────────────────────────────────────────
      - name: 构建并推送 scagent-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent_core/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/scagent-agent:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=agent
